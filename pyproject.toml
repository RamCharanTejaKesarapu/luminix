[project]
name = "luminix"
version = "1.0.0"
description = "Luminix — Autonomous AI Health & Biomechanical Sanctuary"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "mediapipe>=0.10.14",
    "google-generativeai>=0.8.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.33",
    "matplotlib>=3.8",
    "moviepy>=2.0",
    "gtts>=2.5",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "fpdf2>=2.7",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "email-validator>=2.1",
]

[tool.vercel]
entrypoint = "backend.api.main:app"
