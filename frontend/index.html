<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Luminix — Health Intelligence Platform</title>
    <meta name="description" content="Luminix — AI-powered health intelligence with real-time pose tracking, yoga, gym workouts, and fitness coaching.">
    <meta name="theme-color" content="#000000">

    <!-- Fonts: Space Grotesk (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/styles.css">
    <link rel="manifest" href="/manifest.json">

    <!-- Tailwind for utility classes only -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { display: ['Space Grotesk'], body: ['Inter'] },
                    colors: {
                        yellow: { primary: '#FFC400', electric: '#FFE94A', hot: '#FF6A00' },
                        cyan: { primary: '#00E5FF', bright: '#5FFFFF' },
                        black: { base: '#050609', pure: '#000000' }
                    }
                }
            }
        };
    </script>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- Custom Cursor -->
    <div id="cursor-dot" class="custom-cursor" aria-hidden="true"></div>
    <div id="cursor-ring" class="custom-cursor-ring" aria-hidden="true"></div>
    <div id="cursor-label" aria-hidden="true">REVEAL</div>

    <!-- Warning Overlay (risk alert) -->
    <div id="warning-overlay" class="warning-overlay"></div>

    <!-- App Shell -->
    <div id="app-shell" class="auth-locked">

        <!-- ── Sidebar ─────────────────────────────────── -->
        <nav id="main-sidebar">
            <div class="brand-lockup">
                <div>
                    <div class="brand-name" style="text-transform: uppercase; font-size: 1rem; letter-spacing: 0.1em; color: var(--white);">TOJI FUSHIGURO</div>
                    <div class="brand-sub" style="color: var(--cyan-primary);">× LUMINIX</div>
                </div>
            </div>

            <ul id="sidebar-nav">
                <li class="nav-item nav-active" onclick="nav('dashboard')" data-view="dashboard">
                    <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="4" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/></svg>
                    Dashboard
                </li>
                <li class="nav-item" onclick="nav('live-pose')" data-view="live-pose">
                    <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 6v4m-4 2l4-2 4 2m-8 0v4l4 4 4-4v-4"/></svg>
                    <span class="nav-live-dot"></span>
                    Live Pose
                </li>
                <li class="nav-item" onclick="nav('yoga')" data-view="yoga">
                    <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M4 20l4-8 4 4 4-4 4 8"/></svg>
                    Yoga Library
                </li>
                <li class="nav-item" onclick="nav('gym')" data-view="gym">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6.5 6.5h11M2 12h3m14 0h3M5 8v8m14-8v8m-12-6v4m10-4v4"/></svg>
                    Gym Module
                </li>
                <li class="nav-item" onclick="nav('bmi')" data-view="bmi">
                    <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/><path d="M8 12a4 4 0 018 0"/></svg>
                    BMI & Health
                </li>
                <li class="nav-item" onclick="nav('food-tracker')" data-view="food-tracker">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
                    Food Tracker
                </li>
                <li class="nav-item" onclick="nav('luna')" data-view="luna">
                    <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    Luna AI
                </li>
                <li class="nav-item" onclick="nav('export')" data-view="export">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Export
                </li>
            </ul>

            <!-- Right Side Items -->
            <div style="display: flex; align-items: center; gap: 1rem;">
                <!-- Luna Widget -->
                <div class="luna-sidebar-widget cursor-pointer" id="luna-sidebar-widget" onclick="nav('luna')">
                    <div class="luna-orb" id="luna-orb-sidebar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    </div>
                    <div style="font-size:0.75rem;font-weight:700;color:var(--white-2)">Luna AI</div>
                </div>

                <!-- User Profile -->
                <div id="user-profile" class="hidden">
                    <div class="user-avatar" id="profile-avatar">U</div>
                    <div class="user-info">
                        <div id="profile-name">User</div>
                        <div id="profile-email">email@example.com</div>
                    </div>
                    <button class="sign-out-btn" onclick="luminixAuth.logout()">Sign Out</button>
                </div>
            </div>
        </nav>

        <!-- ── Main Content ─────────────────────────────── -->
        <main id="main-content">
            <!-- Populated by app.js -->
        </main>

        <!-- ── Mobile Navigation ─────────────────────────── -->
        <div class="mobile-bottom-nav">
            <button onclick="nav('dashboard')" class="mob-active" data-mob="dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="4" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/></svg>
                Home
            </button>
            <button onclick="nav('live-pose')" data-mob="live-pose">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="4" r="2"/><path d="M12 6v4m-4 2l4-2 4 2m-8 0v4l4 4 4-4v-4"/></svg>
                Live
            </button>
            <button onclick="nav('gym')" data-mob="gym">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 6.5h11M2 12h3m14 0h3M5 8v8m14-8v8m-12-6v4m10-4v4"/></svg>
                Gym
            </button>
            <button onclick="nav('bmi')" data-mob="bmi">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                BMI
            </button>
            <button onclick="nav('food-tracker')" data-mob="food-tracker">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/></svg>
                Food
            </button>
            <button onclick="nav('luna')" data-mob="luna">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2"/></svg>
                Luna
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/auth.js"></script>
    <script src="/static/app.js"></script>
    <script src="/static/yoga.js"></script>
    <script src="/static/gym.js"></script>
    <script src="/static/nutrition.js"></script>
</body>
</html>
