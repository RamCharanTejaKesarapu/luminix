      <stop offset="0%" stop-color="#ff5a3c" />
      <stop offset="70%" stop-color="#e0231c" />
      <stop offset="100%" stop-color="#991410" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
