# Netlify Configuration inside frontend/
[build]
  publish = "."

[functions]
  directory = "functions"

# Serverless function rewrite for donation note submission
[[redirects]]
  from = "/v1/creator/donation"
  to = "/.netlify/functions/donation"
  status = 200

# Serverless function rewrite for smart fridge recipe suggestion
[[redirects]]
  from = "/v1/cook/suggest"
  to = "/.netlify/functions/recipes"
  status = 200

# Serverless function rewrite for Luna AI chat
[[redirects]]
  from = "/v1/luna/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/v1/chat/luna"
  to = "/.netlify/functions/chat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self)"
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache static assets (images, audio, fonts) for performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static path rewrite (maps /static/* to root frontend files)
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# Clean URL routing for HTML pages
[[redirects]]
  from = "/auth"
  to = "/auth.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/accessibility"
  to = "/accessibility.html"
  status = 200

[[redirects]]
  from = "/companion"
  to = "/companion.html"
  status = 200
