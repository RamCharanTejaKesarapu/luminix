name: Luminix CI & Security Test Suite

on:
  push:
    branches: [ main, compliance/dpdp ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Pytest & Security Hardening Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Test Suite
        env:
          JWT_SECRET_KEY: ci-test-secret-key-32-chars-long-value
          GEMINI_API_KEY: ""
        run: |
          pytest tests/ -v
